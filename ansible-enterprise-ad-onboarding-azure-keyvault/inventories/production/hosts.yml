---
all:
  children:
    domain_controllers:
      hosts:
        windows-vm.nat.net:
          ansible_host: 10.0.3.6
  vars:
    domain_name: nat.net
    enable_dry_run: false
    server_name_pattern: '^[a-zA-Z0-9\-]+$'
    app_name_pattern: '^[a-zA-Z0-9\-_]+$'
    domain_name_pattern: '^[a-zA-Z0-9\-\.]+$'

