---
- name: RETRIEVE CREDENTIALS FROM AZURE KEY VAULT USING REST API
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    azure_credential_name: "Azure Service Principal"
    keyvault_name: "{{ lookup('env', 'KEYVAULT_NAME') | default('', true) }}"
    secret_names:
      - "ansible-tower-license"
      - "controller-admin-password"
      - "automationhub-admin-password"
      - "eda-admin-password"
      - "automationgateway-admin-password"
      - "postgresql-admin-password"
      - "redis-admin-password"
      - "controller-secret-key"
      - "hub-secret-key"
      - "eda-secret-key"
      - "gateway-secret-key"
    enable_dry_run: false
    azure_rest_api_version: "7.0"

  tasks:
    - name: AZURE | Validate Azure credentials from AAP credential
      ansible.builtin.debug:
        msg: "✓ Azure credentials validated"
      changed_when: false

    - name: AZURE | Get Azure credentials from AAP credential
      ansible.builtin.set_fact:
        azure_client_id: "{{ lookup('ansible.builtin.credential', azure_credential_name, 'username') | default('') }}"
        azure_client_secret: "{{ lookup('ansible.builtin.credential', azure_credential_name, 'password') | default('') }}"
        azure_tenant_id: "{{ lookup('ansible.builtin.credential', azure_credential_name, 'tenant') | default('') }}"
        azure_subscription_id: "{{ lookup('ansible.builtin.credential', azure_credential_name, 'subscription') | default('') }}"
      no_log: true

    - name: AZURE | Get Azure Access Token
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ azure_tenant_id }}/oauth2/v2.0/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ azure_client_id }}"
          client_secret: "{{ azure_client_secret }}"
          scope: "https://vault.azure.net/.default"
          grant_type: "client_credentials"
        validate_certs: yes
        timeout: 30
      register: token_response
      no_log: true
      when: keyvault_name != ""

    - name: AZURE | Set access token fact
      ansible.builtin.set_fact:
        azure_access_token: "{{ token_response.json.access_token }}"
      when: 
        - keyvault_name != ""
        - token_response is defined
        - token_response.json is defined
        - token_response.json.access_token is defined
      no_log: true

    - name: AZURE | Retrieve secrets from Key Vault using REST API
      ansible.builtin.uri:
        url: "https://{{ keyvault_name }}.vault.azure.net/secrets/{{ item }}?api-version={{ azure_rest_api_version }}"
        method: GET
        headers:
          Authorization: "Bearer {{ azure_access_token }}"
        validate_certs: yes
        timeout: 30
        return_content: yes
      loop: "{{ secret_names }}"
      register: az_secret_result
      when: keyvault_name != ""
      ignore_errors: yes
      no_log: true

    - name: AZURE | Set facts from retrieved secrets
      ansible.builtin.set_fact:
        "{{ item.item | replace('-', '_') }}": "{{ item.json.value }}"
      loop: "{{ az_secret_result.results }}"
      when: 
        - keyvault_name != ""
        - item is defined
        - item.json is defined
        - item.json.value is defined
        - item.json.value != ""

    - name: AZURE | Debug retrieved secrets (excluding passwords)
      ansible.builtin.debug:
        msg: |
          ✓ Retrieved secrets from Key Vault: {{ keyvault_name }}
          - License: {{ ansible_tower_license | default('NOT FOUND') | truncate(50) }}
          - Controller Admin Password: {{ 'SET' if controller_admin_password is defined else 'NOT FOUND' }}
          - Hub Admin Password: {{ 'SET' if automationhub_admin_password is defined else 'NOT FOUND' }}
          - EDA Admin Password: {{ 'SET' if eda_admin_password is defined else 'NOT FOUND' }}
          - Gateway Admin Password: {{ 'SET' if automationgateway_admin_password is defined else 'NOT FOUND' }}
          - PostgreSQL Admin Password: {{ 'SET' if postgresql_admin_password is defined else 'NOT FOUND' }}
          - Redis Admin Password: {{ 'SET' if redis_admin_password is defined else 'NOT FOUND' }}
          - Controller Secret Key: {{ 'SET' if controller_secret_key is defined else 'NOT FOUND' }}
          - Hub Secret Key: {{ 'SET' if hub_secret_key is defined else 'NOT FOUND' }}
          - EDA Secret Key: {{ 'SET' if eda_secret_key is defined else 'NOT FOUND' }}
          - Gateway Secret Key: {{ 'SET' if gateway_secret_key is defined else 'NOT FOUND' }}
      when: keyvault_name != ""
      changed_when: false

    - name: AZURE | Generate inventory file with retrieved secrets
      ansible.builtin.copy:
        dest: /tmp/aap_inventory.yml
        content: |
          ---
          all:
            children:
              automationcontroller:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    controller_admin_password: "{{ controller_admin_password | default('') }}"
                    controller_secret_key: "{{ controller_secret_key | default('') }}"
              
              execution_nodes:
                hosts:
                  execution.example.com:
                    ansible_host: execution.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
              
              database:
                hosts:
                  db.example.com:
                    ansible_host: db.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    postgresql_admin_password: "{{ postgresql_admin_password | default('') }}"
              
              automationhub:
                hosts:
                  hub.example.com:
                    ansible_host: hub.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    automationhub_admin_password: "{{ automationhub_admin_password | default('') }}"
                    hub_secret_key: "{{ hub_secret_key | default('') }}"
              
              automationgateway:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    automationgateway_admin_password: "{{ automationgateway_admin_password | default('') }}"
                    gateway_secret_key: "{{ gateway_secret_key | default('') }}"
              
              eda:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    eda_admin_password: "{{ eda_admin_password | default('') }}"
                    eda_secret_key: "{{ eda_secret_key | default('') }}"
              
              all:
                vars:
                  ansible_python_interpreter: /usr/bin/python3
                  ansible_become: true
                  ansible_become_method: sudo
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined
        - automationhub_admin_password is defined

    - name: AZURE | Create AAP installation directory
      ansible.builtin.file:
        path: /home/admin/aap
        state: directory
        owner: admin
        group: admin
        mode: '0755'
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Copy inventory file to AAP directory
      ansible.builtin.copy:
        src: /tmp/aap_inventory.yml
        dest: /home/admin/aap/inventory.yml
        owner: admin
        group: admin
        mode: '0644'
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Clean up temporary inventory file
      ansible.builtin.file:
        path: /tmp/aap_inventory.yml
        state: absent
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Display success message
      ansible.builtin.debug:
        msg: |
          ==========================================
          ✅ AZURE KEY VAULT RETRIEVAL COMPLETE ✅
          ==========================================
          
          Secrets have been retrieved from Azure Key Vault: {{ keyvault_name }}
          
          Inventory file created at: /home/admin/aap/inventory.yml
          
          To deploy AAP:
          cd /home/admin/aap
          ansible-playbook -i inventory.yml ansible.containerized_installer.install
          
          ==========================================
      when: keyvault_name != ""
      changed_when: false

    - name: AZURE | Fail if Key Vault name not provided
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ KEY VAULT NAME NOT PROVIDED ❌
          ==========================================
          
          Please set the KEYVAULT_NAME as an extra variable in AAP:
          KEYVAULT_NAME: your-keyvault-name
          ==========================================
      when: keyvault_name == ""

    - name: AZURE | Fail if secrets not retrieved
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ SECRETS RETRIEVAL FAILED ❌
          ==========================================
          
          Could not retrieve secrets from Azure Key Vault: {{ keyvault_name }}
          
          Please verify:
          1. Key Vault name is correct
          2. Service Principal has 'Key Vault Secrets User' role
          3. Secrets exist with exact names specified
          4. Network connectivity to Azure
          ==========================================
      when: 
        - keyvault_name != ""
        - controller_admin_password is not defined
        - automationhub_admin_password is not defined
      ignore_errors: no