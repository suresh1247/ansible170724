---
- name: RETRIEVE CREDENTIALS FROM AZURE KEY VAULT
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    azure_credential_name: "Azure Service Principal"
    keyvault_name: "{{ lookup('env', 'KEYVAULT_NAME') | default('', true) }}"
    secret_names:
      - "ansible-tower-license"
      - "controller-admin-password"
      - "automationhub-admin-password"
      - "eda-admin-password"
      - "automationgateway-admin-password"
      - "postgresql-admin-password"
      - "redis-admin-password"
      - "controller-secret-key"
      - "hub-secret-key"
      - "eda-secret-key"
      - "gateway-secret-key"

  tasks:
    - name: AZURE | Validate Azure credentials from AAP credential
      ansible.builtin.debug:
        msg: "✓ Azure credentials validated"
      changed_when: false

    - name: AZURE | Check if Azure CLI is installed
      ansible.builtin.command: az --version
      register: az_cli_check
      failed_when: false
      changed_when: false
      ignore_errors: yes

    - name: AZURE | Install Azure CLI on RHEL
      ansible.builtin.dnf:
        name: azure-cli
        state: present
      when: az_cli_check.rc != 0
      become: yes
      register: az_cli_install
      ignore_errors: yes

    - name: AZURE | Verify Azure CLI is available after installation
      ansible.builtin.command: az --version
      register: az_cli_verify
      changed_when: false
      when: az_cli_check.rc != 0
      ignore_errors: yes

    - name: AZURE | Fail if Azure CLI not available
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AZURE CLI NOT AVAILABLE ❌
          ==========================================
          Azure CLI is required for this playbook.
          
          Please install Azure CLI manually on the AAP runner:
          sudo dnf install -y azure-cli
          
          Or visit: https://docs.microsoft.com/en-us/cli/azure/install-azure-cli
          ==========================================
      when: 
        - az_cli_check.rc != 0
        - az_cli_install is defined
        - az_cli_install.failed is defined
        - az_cli_install.failed == true

    - name: AZURE | Login to Azure using service principal
      ansible.builtin.shell: |
        az login --service-principal \
          --username "{{ lookup('ansible.builtin.credential', azure_credential_name, 'username') }}" \
          --password "{{ lookup('ansible.builtin.credential', azure_credential_name, 'password') }}" \
          --tenant "{{ lookup('ansible.builtin.credential', azure_credential_name, 'tenant') }}"
      register: az_login
      changed_when: false
      no_log: true
      when: keyvault_name != ""

    - name: AZURE | Set Azure subscription
      ansible.builtin.shell: |
        az account set --subscription "{{ lookup('ansible.builtin.credential', azure_credential_name, 'subscription') }}"
      register: az_subscription
      changed_when: false
      when: keyvault_name != ""

    - name: AZURE | Retrieve secrets from Key Vault
      ansible.builtin.shell: |
        az keyvault secret show \
          --vault-name "{{ keyvault_name }}" \
          --name "{{ item }}" \
          --query value \
          --output tsv
      register: az_secret_result
      loop: "{{ secret_names }}"
      when: keyvault_name != ""
      changed_when: false
      ignore_errors: yes
      no_log: true

    - name: AZURE | Set facts from retrieved secrets
      ansible.builtin.set_fact:
        "{{ item.item | replace('-', '_') }}": "{{ item.stdout }}"
      loop: "{{ az_secret_result.results }}"
      when: 
        - keyvault_name != ""
        - item.stdout is defined
        - item.stdout != ""

    - name: AZURE | Debug retrieved secrets (excluding passwords)
      ansible.builtin.debug:
        msg: |
          ✓ Retrieved secrets from Key Vault: {{ keyvault_name }}
          - License: {{ ansible_tower_license | default('NOT FOUND') | truncate(50) }}
          - Controller Admin Password: {{ 'SET' if controller_admin_password is defined else 'NOT FOUND' }}
          - Hub Admin Password: {{ 'SET' if automationhub_admin_password is defined else 'NOT FOUND' }}
          - EDA Admin Password: {{ 'SET' if eda_admin_password is defined else 'NOT FOUND' }}
          - Gateway Admin Password: {{ 'SET' if automationgateway_admin_password is defined else 'NOT FOUND' }}
          - PostgreSQL Admin Password: {{ 'SET' if postgresql_admin_password is defined else 'NOT FOUND' }}
          - Redis Admin Password: {{ 'SET' if redis_admin_password is defined else 'NOT FOUND' }}
          - Controller Secret Key: {{ 'SET' if controller_secret_key is defined else 'NOT FOUND' }}
          - Hub Secret Key: {{ 'SET' if hub_secret_key is defined else 'NOT FOUND' }}
          - EDA Secret Key: {{ 'SET' if eda_secret_key is defined else 'NOT FOUND' }}
          - Gateway Secret Key: {{ 'SET' if gateway_secret_key is defined else 'NOT FOUND' }}
      when: keyvault_name != ""
      changed_when: false

    - name: AZURE | Generate inventory file with retrieved secrets
      ansible.builtin.copy:
        dest: /tmp/aap_inventory.yml
        content: |
          ---
          all:
            children:
              automationcontroller:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    controller_admin_password: "{{ controller_admin_password | default('') }}"
                    controller_secret_key: "{{ controller_secret_key | default('') }}"
              
              execution_nodes:
                hosts:
                  execution.example.com:
                    ansible_host: execution.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
              
              database:
                hosts:
                  db.example.com:
                    ansible_host: db.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    postgresql_admin_password: "{{ postgresql_admin_password | default('') }}"
              
              automationhub:
                hosts:
                  hub.example.com:
                    ansible_host: hub.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    automationhub_admin_password: "{{ automationhub_admin_password | default('') }}"
                    hub_secret_key: "{{ hub_secret_key | default('') }}"
              
              automationgateway:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    automationgateway_admin_password: "{{ automationgateway_admin_password | default('') }}"
                    gateway_secret_key: "{{ gateway_secret_key | default('') }}"
              
              eda:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    eda_admin_password: "{{ eda_admin_password | default('') }}"
                    eda_secret_key: "{{ eda_secret_key | default('') }}"
              
              all:
                vars:
                  ansible_python_interpreter: /usr/bin/python3
                  ansible_become: true
                  ansible_become_method: sudo
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined
        - automationhub_admin_password is defined

    - name: AZURE | Create AAP installation directory
      ansible.builtin.file:
        path: /home/admin/aap
        state: directory
        owner: admin
        group: admin
        mode: '0755'
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Copy inventory file to AAP directory
      ansible.builtin.copy:
        src: /tmp/aap_inventory.yml
        dest: /home/admin/aap/inventory.yml
        owner: admin
        group: admin
        mode: '0644'
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Clean up temporary inventory file
      ansible.builtin.file:
        path: /tmp/aap_inventory.yml
        state: absent
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Display success message
      ansible.builtin.debug:
        msg: |
          ==========================================
          ✅ AZURE KEY VAULT RETRIEVAL COMPLETE ✅
          ==========================================
          
          Secrets have been retrieved from Azure Key Vault: {{ keyvault_name }}
          
          Inventory file created at: /home/admin/aap/inventory.yml
          
          To deploy AAP:
          cd /home/admin/aap
          ansible-playbook -i inventory.yml ansible.containerized_installer.install
          
          ==========================================
      when: keyvault_name != ""
      changed_when: false

    - name: AZURE | Fail if Key Vault name not provided
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ KEY VAULT NAME NOT PROVIDED ❌
          ==========================================
          
          Please set the KEYVAULT_NAME environment variable:
          export KEYVAULT_NAME=your-keyvault-name
          
          Or pass it directly:
          ansible-playbook -e KEYVAULT_NAME=your-keyvault-name ad-onboarding.yml
          ==========================================
      when: keyvault_name == ""
      ignore_errors: no

    - name: AZURE | Logout from Azure
      ansible.builtin.shell: az logout
      register: az_logout
      changed_when: false
      when: keyvault_name != ""
      ignore_errors: yes