---
- name: RETRIEVE CREDENTIALS FROM AZURE KEY VAULT USING REST API
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    keyvault_name: "{{ lookup('env', 'KEYVAULT_NAME') | default('', true) }}"
    secret_names:
      - "ansible-tower-license"
      - "controller-admin-password"
      - "automationhub-admin-password"
      - "eda-admin-password"
      - "automationgateway-admin-password"
      - "postgresql-admin-password"
      - "redis-admin-password"
      - "controller-secret-key"
      - "hub-secret-key"
      - "eda-secret-key"
      - "gateway-secret-key"
    enable_dry_run: false
    azure_rest_api_version: "7.0"

  tasks:
    - name: AZURE | Validate Azure credentials are provided
      ansible.builtin.debug:
        msg: |
          ✓ Azure credentials validated
          Client ID: {{ azure_client_id | default('MISSING') | truncate(10) }}
          Tenant ID: {{ azure_tenant_id | default('MISSING') | truncate(10) }}
          Subscription: {{ azure_subscription_id | default('MISSING') | truncate(10) }}
      when: 
        - azure_client_id is defined
        - azure_tenant_id is defined
        - azure_subscription_id is defined

    - name: AZURE | Verify credentials are set
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AZURE CREDENTIALS MISSING ❌
          ==========================================
          
          Please add these variables to your Job Template Extra Variables:
          
          azure_client_id: "4de43aec-3cfe-4235-a853-c542e48371bb"
          azure_client_secret: "c_l8Q~mdB3L0sUjB~-4oF~sm~igc0KexyDGRfbet"
          azure_tenant_id: "84b7f57c-6b05-41a1-9915-d17b5ed9000e"
          azure_subscription_id: "264c88cf-3a13-4f74-b8e3-b3976a5f2a30"
          ==========================================
      when: 
        - azure_client_id is not defined or azure_client_id == ''
        - azure_client_secret is not defined or azure_client_secret == ''
        - azure_tenant_id is not defined or azure_tenant_id == ''
        - azure_subscription_id is not defined or azure_subscription_id == ''

    - name: AZURE | Get Azure Access Token
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ azure_tenant_id }}/oauth2/v2.0/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ azure_client_id }}"
          client_secret: "{{ azure_client_secret }}"
          scope: "https://vault.azure.net/.default"
          grant_type: "client_credentials"
        validate_certs: yes
        timeout: 30
        status_code: 200
      register: token_response
      no_log: true
      when: keyvault_name != ""
      ignore_errors: yes

    - name: AZURE | Fail if token retrieval failed
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AZURE TOKEN RETRIEVAL FAILED ❌
          ==========================================
          
          Could not authenticate with Azure.
          Status Code: {{ token_response.status | default('N/A') }}
          Error: {{ token_response.msg | default('Unknown error') }}
          Response: {{ token_response.content | default('No response') }}
          
          Please verify:
          1. Client ID is correct
          2. Client Secret is correct
          3. Tenant ID is correct
          4. Service Principal has proper permissions
          5. Network connectivity to Azure
          ==========================================
      when: 
        - keyvault_name != ""
        - token_response is defined
        - token_response.status is defined
        - token_response.status != 200

    - name: AZURE | Set access token fact
      ansible.builtin.set_fact:
        azure_access_token: "{{ token_response.json.access_token }}"
      when: 
        - keyvault_name != ""
        - token_response is defined
        - token_response.json is defined
        - token_response.json.access_token is defined
      no_log: true

    - name: AZURE | Retrieve secrets from Key Vault
      ansible.builtin.uri:
        url: "https://{{ keyvault_name }}.vault.azure.net/secrets/{{ item }}?api-version={{ azure_rest_api_version }}"
        method: GET
        headers:
          Authorization: "Bearer {{ azure_access_token }}"
        validate_certs: yes
        timeout: 30
        return_content: yes
        status_code: 200
      loop: "{{ secret_names }}"
      register: az_secret_result
      when: 
        - keyvault_name != ""
        - azure_access_token is defined
      ignore_errors: yes
      no_log: true

    - name: AZURE | Set facts from retrieved secrets
      ansible.builtin.set_fact:
        "{{ item.item | replace('-', '_') }}": "{{ item.json.value }}"
      loop: "{{ az_secret_result.results }}"
      when: 
        - keyvault_name != ""
        - item is defined
        - item.json is defined
        - item.json.value is defined
        - item.json.value != ""
        - item.status is defined
        - item.status == 200

    - name: AZURE | Debug retrieved secrets summary
      ansible.builtin.debug:
        msg: |
          ==========================================
          ✓ SECRETS RETRIEVED FROM KEY VAULT
          ==========================================
          Key Vault: {{ keyvault_name }}
          
          Retrieved Secrets:
          - Controller Admin Password: {{ '✅' if controller_admin_password is defined else '❌' }}
          - Hub Admin Password: {{ '✅' if automationhub_admin_password is defined else '❌' }}
          - EDA Admin Password: {{ '✅' if eda_admin_password is defined else '❌' }}
          - Gateway Admin Password: {{ '✅' if automationgateway_admin_password is defined else '❌' }}
          - PostgreSQL Admin Password: {{ '✅' if postgresql_admin_password is defined else '❌' }}
          - Redis Admin Password: {{ '✅' if redis_admin_password is defined else '❌' }}
          - Controller Secret Key: {{ '✅' if controller_secret_key is defined else '❌' }}
          - Hub Secret Key: {{ '✅' if hub_secret_key is defined else '❌' }}
          - EDA Secret Key: {{ '✅' if eda_secret_key is defined else '❌' }}
          - Gateway Secret Key: {{ '✅' if gateway_secret_key is defined else '❌' }}
          ==========================================
      when: keyvault_name != ""
      changed_when: false

    - name: AZURE | Fail if required secrets not retrieved
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ REQUIRED SECRETS NOT FOUND ❌
          ==========================================
          
          Missing required secrets from Key Vault: {{ keyvault_name }}
          
          Please ensure these secrets exist:
          1. controller-admin-password
          2. automationhub-admin-password
          
          Also ensure Service Principal has 'Key Vault Secrets User' role.
          ==========================================
      when: 
        - keyvault_name != ""
        - controller_admin_password is not defined
        - automationhub_admin_password is not defined

    - name: AZURE | Generate inventory file
      ansible.builtin.copy:
        dest: /tmp/aap_inventory.yml
        content: |
          ---
          all:
            children:
              automationcontroller:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    controller_admin_password: "{{ controller_admin_password | default('') }}"
                    controller_secret_key: "{{ controller_secret_key | default('') }}"
              
              execution_nodes:
                hosts:
                  execution.example.com:
                    ansible_host: execution.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
              
              database:
                hosts:
                  db.example.com:
                    ansible_host: db.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    postgresql_admin_password: "{{ postgresql_admin_password | default('') }}"
              
              automationhub:
                hosts:
                  hub.example.com:
                    ansible_host: hub.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    automationhub_admin_password: "{{ automationhub_admin_password | default('') }}"
                    hub_secret_key: "{{ hub_secret_key | default('') }}"
              
              automationgateway:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    automationgateway_admin_password: "{{ automationgateway_admin_password | default('') }}"
                    gateway_secret_key: "{{ gateway_secret_key | default('') }}"
              
              eda:
                hosts:
                  controller.example.com:
                    ansible_host: controller.example.com
                    ansible_user: admin
                    ansible_ssh_private_key_file: /home/admin/.ssh/id_rsa
                    eda_admin_password: "{{ eda_admin_password | default('') }}"
                    eda_secret_key: "{{ eda_secret_key | default('') }}"
              
              all:
                vars:
                  ansible_python_interpreter: /usr/bin/python3
                  ansible_become: true
                  ansible_become_method: sudo
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined
        - automationhub_admin_password is defined

    - name: AZURE | Create AAP installation directory
      ansible.builtin.file:
        path: /home/admin/aap
        state: directory
        owner: admin
        group: admin
        mode: '0755'
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Copy inventory file to AAP directory
      ansible.builtin.copy:
        src: /tmp/aap_inventory.yml
        dest: /home/admin/aap/inventory.yml
        owner: admin
        group: admin
        mode: '0644'
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Clean up temporary inventory file
      ansible.builtin.file:
        path: /tmp/aap_inventory.yml
        state: absent
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Display success message
      ansible.builtin.debug:
        msg: |
          ==========================================
          ✅ AZURE KEY VAULT RETRIEVAL COMPLETE ✅
          ==========================================
          
          Secrets retrieved from: {{ keyvault_name }}
          Inventory file: /home/admin/aap/inventory.yml
          
          Next Steps:
          cd /home/admin/aap
          ansible-playbook -i inventory.yml ansible.containerized_installer.install
          ==========================================
      when: 
        - keyvault_name != ""
        - controller_admin_password is defined

    - name: AZURE | Fail if Key Vault not provided
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ KEY VAULT NAME NOT PROVIDED ❌
          ==========================================
          
          Add to Job Template Extra Variables:
          KEYVAULT_NAME: ansible-aap-kv
          ==========================================
      when: keyvault_name == ""

    - name: AZURE | Logout cleanup (no-op for REST API)
      ansible.builtin.debug:
        msg: "✓ REST API session completed"
      when: keyvault_name != ""