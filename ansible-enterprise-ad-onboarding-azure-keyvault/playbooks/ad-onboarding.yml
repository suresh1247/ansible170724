---
- name: ENTERPRISE ACTIVE DIRECTORY ONBOARDING
  hosts: domain_controllers
  gather_facts: no
  
  vars:
    # Azure Key Vault Configuration
    keyvault_name_from_env: "{{ lookup('env', 'KEYVAULT_NAME') | default('') }}"
    keyvault_name_from_var: "{{ KEYVAULT_NAME | default('') }}"
    keyvault_name: "{{ keyvault_name_from_var if keyvault_name_from_var != '' else keyvault_name_from_env }}"
    azure_rest_api_version: "7.0"
    
    # Set default values
    enable_dry_run: false
    ad_retries: 3
    ad_delay: 5
    
    # Operation tracking
    operation_id: "{{ lookup('password', '/dev/null length=12 chars=hex') | upper }}"
    operation_start_time: "{{ ansible_date_time.epoch }}"
    
    # Validation patterns
    server_name_pattern: '^[A-Za-z][A-Za-z0-9-]{2,14}$'
    app_name_pattern: '^[A-Za-z][A-Za-z0-9_]{2,30}$'
    domain_name_pattern: '^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$'
    
    # Base OU path
    ou_base_dn: "DC={{ domain_name.replace('.', ',DC=') }}"
    
    # Default values for reporting
    ou_creation: { stdout: "EXISTS" }
    group_creation: { stdout: "EXISTS" }
    opsintel_add: { stdout: "ALREADY_MEMBER" }
    gpo_creation: { stdout: "EXISTS" }
    gpo_link: { stdout: "ALREADY_LINKED" }
    restricted_group_config: { stdout: "CONFIGURED" }
    gpupdate_result: { stdout: "INITIATED" }
    server_move: { stdout: "NOT_MOVED" }
    verify_restricted_group: { stdout: "VERIFIED" }

  # Pre-tasks: Azure Key Vault Credential Retrieval
  pre_tasks:
    # ============================================
    # All Azure tasks run on localhost with local connection
    # ============================================
    - name: AZURE | Display debug information
      ansible.builtin.debug:
        msg: |
          ==========================================
          🔍 CONNECTION DEBUG
          ==========================================
          Target Host: {{ inventory_hostname }}
          KEYVAULT_NAME: {{ keyvault_name | default('NOT SET') }}
          Azure Client ID: {{ azure_client_id | default('NOT SET') | truncate(10) }}
          Azure Tenant ID: {{ azure_tenant_id | default('NOT SET') | truncate(10) }}
          ==========================================
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Fail if Key Vault name not provided
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ KEY VAULT NAME NOT PROVIDED ❌
          ==========================================
          
          KEYVAULT_NAME is required but was not found.
          
          Please add to Job Template Extra Variables:
          
          ---
          KEYVAULT_NAME: ansible-aap-kv
          azure_client_id: "your-client-id"
          azure_client_secret: "your-client-secret"
          azure_tenant_id: "your-tenant-id"
          azure_subscription_id: "your-subscription-id"
          server_name: "WEBAPP01"
          application_name: "WebApp"
          domain_name: "nat.net"
          requester_confirmation: "YES"
          enable_dry_run: false
          ==========================================
      when: keyvault_name == ""
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Verify Azure credentials are set
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AZURE CREDENTIALS MISSING ❌
          ==========================================
          
          Please add these variables to Extra Variables:
          
          azure_client_id: "your-client-id"
          azure_client_secret: "your-client-secret"
          azure_tenant_id: "your-tenant-id"
          azure_subscription_id: "your-subscription-id"
          ==========================================
      when: 
        - keyvault_name != ""
        - azure_client_id is not defined or azure_client_id == ''
        - azure_client_secret is not defined or azure_client_secret == ''
        - azure_tenant_id is not defined or azure_tenant_id == ''
        - azure_subscription_id is not defined or azure_subscription_id == ''
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Get Azure Access Token
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ azure_tenant_id }}/oauth2/v2.0/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ azure_client_id }}"
          client_secret: "{{ azure_client_secret }}"
          scope: "https://vault.azure.net/.default"
          grant_type: "client_credentials"
        validate_certs: yes
        timeout: 30
        status_code: 200
      register: token_response
      no_log: false
      when: 
        - keyvault_name != ""
        - azure_client_id is defined and azure_client_id != ""
        - azure_client_secret is defined and azure_client_secret != ""
        - azure_tenant_id is defined and azure_tenant_id != ""
      ignore_errors: yes
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Display token response for debugging
      ansible.builtin.debug:
        msg: |
          ==========================================
          🔍 TOKEN RESPONSE DEBUG
          ==========================================
          Status: {{ token_response.status | default('N/A') }}
          Response: {{ token_response.content | default('No response') | truncate(500) }}
          ==========================================
      when: 
        - keyvault_name != ""
        - token_response is defined
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Fail if token retrieval failed
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AZURE TOKEN RETRIEVAL FAILED ❌
          ==========================================
          
          Could not authenticate with Azure.
          Status Code: {{ token_response.status | default('N/A') }}
          Error: {{ token_response.msg | default('Unknown error') }}
          Response: {{ token_response.content | default('No response') }}
          
          Please verify:
          1. Client ID is correct
          2. Client Secret is correct
          3. Tenant ID is correct
          4. Service Principal has proper permissions
          5. Network connectivity to Azure (login.microsoftonline.com)
          ==========================================
      when: 
        - keyvault_name != ""
        - token_response is defined
        - token_response.status is defined
        - token_response.status != 200
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Set access token fact
      ansible.builtin.set_fact:
        azure_access_token: "{{ token_response.json.access_token }}"
      when: 
        - keyvault_name != ""
        - token_response is defined
        - token_response.json is defined
        - token_response.json.access_token is defined
      no_log: true
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Retrieve AD credentials from Key Vault
      ansible.builtin.uri:
        url: "https://{{ keyvault_name }}.vault.azure.net/secrets/{{ item }}?api-version={{ azure_rest_api_version }}"
        method: GET
        headers:
          Authorization: "Bearer {{ azure_access_token }}"
        validate_certs: yes
        timeout: 30
        return_content: yes
        status_code: 200
      loop:
        - "ad-domain-admin-username"
        - "ad-domain-admin-password"
        - "ad-domain-name"
      register: ad_secret_result
      when: 
        - keyvault_name != ""
        - azure_access_token is defined
        - azure_access_token != ""
      ignore_errors: yes
      no_log: false
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Display secret retrieval status
      ansible.builtin.debug:
        msg: |
          ==========================================
          🔍 SECRET RETRIEVAL DEBUG
          ==========================================
          Status codes: {{ ad_secret_result.results | map(attribute='status') | list }}
          ==========================================
      when: 
        - keyvault_name != ""
        - ad_secret_result is defined
        - ad_secret_result.results is defined
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Set AD credentials from retrieved secrets
      ansible.builtin.set_fact:
        ad_username: "{{ (ad_secret_result.results | selectattr('item', 'equalto', 'ad-domain-admin-username') | first).json.value }}"
        ad_password: "{{ (ad_secret_result.results | selectattr('item', 'equalto', 'ad-domain-admin-password') | first).json.value }}"
        ad_domain_name: "{{ (ad_secret_result.results | selectattr('item', 'equalto', 'ad-domain-name') | first).json.value }}"
      when: 
        - keyvault_name != ""
        - ad_secret_result is defined
        - ad_secret_result.results is defined
      no_log: true
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Fail if AD credentials not retrieved
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AD CREDENTIALS NOT FOUND ❌
          ==========================================
          
          Could not retrieve AD credentials from Azure Key Vault: {{ keyvault_name }}
          
          Please ensure these secrets exist in Key Vault:
          1. ad-domain-admin-username
          2. ad-domain-admin-password
          3. ad-domain-name
          ==========================================
      when: 
        - keyvault_name != ""
        - ad_username is not defined or ad_username == ''
        - ad_password is not defined or ad_password == ''
        - ad_domain_name is not defined or ad_domain_name == ''
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Display credential retrieval status
      ansible.builtin.debug:
        msg: |
          ✅ AD credentials retrieved from Azure Key Vault: {{ keyvault_name }}
          - Domain Admin Username: {{ ad_username | default('MISSING') }}
          - Domain Name: {{ ad_domain_name | default('MISSING') }}
      when: 
        - keyvault_name != ""
        - ad_username is defined
        - ad_domain_name is defined
      delegate_to: localhost
      connection: local
      run_once: true
      no_log: false

    # ============================================
    # NOW Set WinRM connection for Windows host
    # ============================================
    - name: CONNECTION | Set WinRM connection variables for Windows host
      ansible.builtin.set_fact:
        ansible_user: "{{ ad_username }}"
        ansible_password: "{{ ad_password }}"
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_port: 5985
        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 120
        ansible_become_method: runas
        ansible_become_user: SYSTEM
      no_log: true
      when: 
        - ad_username is defined
        - ad_password is defined

    # NOW we can gather facts after connection is set
    - name: CONNECTION | Gather facts from Windows host
      ansible.builtin.setup:
        gather_subset:
          - min
      when: 
        - ad_username is defined
        - ad_password is defined

    # Validation Tasks
    - name: VALIDATION | Validate required parameters
      ansible.builtin.assert:
        that:
          - server_name is defined
          - application_name is defined
          - domain_name is defined
          - requester_confirmation is defined
        fail_msg: "Missing required parameters"

    - name: VALIDATION | Validate server name format
      ansible.builtin.assert:
        that:
          - server_name is match(server_name_pattern)
        fail_msg: "Invalid server name '{{ server_name }}'"

    - name: VALIDATION | Validate application name format
      ansible.builtin.assert:
        that:
          - application_name is match(app_name_pattern)
        fail_msg: "Invalid application name '{{ application_name }}'"

    - name: VALIDATION | Validate domain name format
      ansible.builtin.assert:
        that:
          - domain_name is match(domain_name_pattern)
        fail_msg: "Invalid domain name format: {{ domain_name }}"

    - name: VALIDATION | Validate confirmation flag
      ansible.builtin.assert:
        that:
          - requester_confirmation | upper in ['YES', 'NO']
        fail_msg: "Requester confirmation must be YES or NO"

    - name: VALIDATION | Debug vault status
      ansible.builtin.debug:
        msg:
          - "✓ Credentials loaded from Azure Key Vault"
          - "Username from vault: {{ ad_username }}"
          - "Domain from vault: {{ ad_domain_name }}"

    - name: VALIDATION | Check for dry run mode
      ansible.builtin.debug:
        msg: "⚠️ DRY RUN MODE ENABLED - No changes will be made to Active Directory"
      when: enable_dry_run | bool

    - name: CONNECTION | Test connectivity to domain controller
      ansible.windows.win_ping:
      register: ping_test
      until: ping_test is success
      retries: "{{ ad_retries }}"
      delay: "{{ ad_delay }}"

    - name: CONNECTION | Verify Active Directory module
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory -ErrorAction Stop
        Get-ADDomain | Select-Object DNSRoot
      register: ad_verify
      until: ad_verify is success
      retries: "{{ ad_retries }}"
      delay: "{{ ad_delay }}"

    # ============================================
    # CRITICAL: Check Server Existence FIRST
    # ============================================
    - name: SERVER | Search for server in Active Directory
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory -ErrorAction SilentlyContinue
        $Computer = Get-ADComputer -Filter "Name -eq '{{ server_name }}'" -Properties DistinguishedName, CanonicalName, Enabled -ErrorAction SilentlyContinue
        if ($Computer) {
            $Result = @{
                Exists = $true
                DN = $Computer.DistinguishedName
                CanonicalName = $Computer.CanonicalName
                Enabled = $Computer.Enabled
            }
            $Result | ConvertTo-Json
        } else {
            '{"Exists": false}'
        }
      register: server_search
      no_log: false

    - name: SERVER | Parse server information
      ansible.builtin.set_fact:
        server_info: "{{ server_search.stdout | from_json }}"
        server_exists: "{{ (server_search.stdout | from_json).Exists | default(false) }}"
        server_canonical: "{{ (server_search.stdout | from_json).CanonicalName | default('N/A') }}"
        server_enabled: "{{ (server_search.stdout | from_json).Enabled | default(false) }}"

    - name: SERVER | Display server status
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "SERVER STATUS CHECK"
          - "=========================================="
          - "Server Name: {{ server_name }}"
          - "Exists in AD: {{ 'YES' if server_exists else 'NO' }}"
          - "Current Location: {{ server_canonical | default('N/A') }}"
          - "Status: {{ 'Enabled' if server_enabled else 'Disabled' if server_exists else 'N/A' }}"
          - "=========================================="

    # ============================================
    # STOP PLAYBOOK IF SERVER DOES NOT EXIST
    # ============================================
    - name: SERVER | Stop playbook - Server not found in AD
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ OPERATION STOPPED ❌
          ==========================================
          Server '{{ server_name }}' was NOT found in Active Directory.
          
          No OUs, GPOs, or Groups will be created.
          
          Please verify:
          1. The server name is correct
          2. The server is joined to the domain
          3. The server exists in Active Directory
          ==========================================
      when: 
        - not server_exists
        - requester_confirmation | upper == 'NO'

    - name: SERVER | Set server type and target OU (only if server exists)
      ansible.builtin.set_fact:
        server_type: "{{ 'SQL' if 'SQL' in server_name | upper else 'NON-SQL' }}"
        target_ou_dn: >-
          {{
            ('OU=' + application_name + ',OU=SQL,OU=Servers,OU=LKM,' + ou_base_dn)
            if ('SQL' in server_name | upper)
            else ('OU=' + application_name + ',OU=Servers,OU=LKM,' + ou_base_dn)
          }}
        app_prefix: "{{ application_name[:3] | upper }}"
        ad_group_name: "{{ application_name[:3] | upper }}-PAM-{{ application_name }}{{ 'SQL' if ('SQL' in server_name | upper) else '' }}"
        gpo_name: "{{ application_name[:3] | upper }}-SRV-{{ application_name }}{{ 'SQL' if ('SQL' in server_name | upper) else '' }}"
      when: server_exists

  tasks:
    - name: MAIN | Execute AD onboarding (Only if server exists)
      block:
        - name: Include validation role
          ansible.builtin.include_role:
            name: ad_validation
          when: server_exists and not enable_dry_run | bool

        - name: Include OU management role
          ansible.builtin.include_role:
            name: ad_ou_management
          when: server_exists and not enable_dry_run | bool

        - name: Include computer management role
          ansible.builtin.include_role:
            name: ad_computer_management
          when: server_exists and not enable_dry_run | bool

        - name: Include group management role
          ansible.builtin.include_role:
            name: ad_group_management
          when: server_exists and not enable_dry_run | bool

        - name: Include GPO management role
          ansible.builtin.include_role:
            name: ad_gpo_management
          when: server_exists and not enable_dry_run | bool

        - name: Include restricted groups role
          ansible.builtin.include_role:
            name: ad_restricted_groups
          when: server_exists and not enable_dry_run | bool

        - name: Include reporting role
          ansible.builtin.include_role:
            name: ad_reporting
          when: server_exists

      when: server_exists

  post_tasks:
    - name: REPORT | Server not found - Final summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "❌ AD ONBOARDING CANCELLED"
          - "=========================================="
          - "Operation ID: {{ operation_id }}"
          - "Server: {{ server_name }}"
          - "Status: FAILED - Server Not Found in Active Directory"
          - ""
          - "No changes were made to Active Directory."
          - "No OUs, GPOs, or Groups were created."
          - ""
          - "Please verify the server name and try again."
          - "=========================================="
      when: not server_exists

    - name: AZURE | Logout cleanup (no-op for REST API)
      ansible.builtin.debug:
        msg: "✓ Azure REST API session completed"
      when: keyvault_name != ""
      delegate_to: localhost
      connection: local
      run_once: true