---
- name: VALIDATION | Require explicit approval
  ansible.builtin.assert:
    that:
      - requester_confirmation | upper == 'YES'
    fail_msg: |
      ==========================================
      ❌ CHANGE APPROVAL REQUIRED ❌
      ==========================================
      requester_confirmation must be YES
      Current value: {{ requester_confirmation }}
      ==========================================
    success_msg: "✓ Change approval confirmed"

- name: VALIDATION | Verify server exists
  ansible.builtin.assert:
    that:
      - server_exists | bool
    fail_msg: |
      ==========================================
      ❌ SERVER NOT FOUND ❌
      ==========================================
      Server '{{ server_name }}' was not found in Active Directory.
      ==========================================
    success_msg: "✓ Server found in Active Directory"